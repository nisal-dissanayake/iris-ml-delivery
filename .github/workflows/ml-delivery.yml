name: ML Delivery

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Practical A
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      # Exact immutable identity handed to later jobs: ghcr.io/owner/repo@sha256:...
      image_ref: ${{ steps.name.outputs.image }}@${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Choose lowercase image name
        id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (amd64 + arm64)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record version identity
        run: |
          {
            echo "### Published image"
            echo "- Source SHA: \`${{ github.sha }}\`"
            echo "- Tag: \`${{ steps.name.outputs.image }}:sha-${{ github.sha }}\`"
            echo "- Digest reference: \`${{ steps.name.outputs.image }}@${{ steps.publish.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_REF=${{ steps.name.outputs.image }}@${{ steps.publish.outputs.digest }}"

  # ---------------------------------------------------------------- Practical B
  load_test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      CONTAINER: iris-staging
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Locust (test tooling only)
        run: python -m pip install "locust>=2.32,<3"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact digest and start staging container
        run: |
          echo "Testing $IMAGE_REF"
          docker pull "$IMAGE_REF"
          docker run -d --name "$CONTAINER" -p 127.0.0.1:5000:5000 "$IMAGE_REF"

      - name: Smoke checks
        run: python scripts/smoke.py http://127.0.0.1:5000

      - name: Load gate (20 users, 5/s, 60 s)
        run: |
          mkdir -p reports
          echo "$IMAGE_REF" > reports/image-ref.txt
          locust -f locustfile.py --headless --host http://127.0.0.1:5000 \
            -u 20 -r 5 -t 60s --stop-timeout 5 \
            --csv reports/staging --html reports/staging.html

      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report-${{ github.sha }}
          path: reports/
          if-no-files-found: warn

      - name: Show container logs
        if: always()
        run: docker logs "$CONTAINER" || true

      - name: Remove staging container
        if: always()
        run: docker rm -f "$CONTAINER" || true

  # ---------------------------------------------------------------- Practical C
  release:
    needs: [build, load_test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # required reviewer configured in Settings -> Environments
    permissions:
      contents: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Prepare approved release bundle
        run: |
          mkdir -p release
          cp compose.yaml release/compose.yaml
          cp scripts/smoke.py release/smoke.py
          printf 'IMAGE_REF=%s\nHOST_PORT=5000\n' "$IMAGE_REF" > release/release.env
          echo "$SOURCE_SHA" > release/source-commit.txt
          echo "Release contents:"; ls -l release; cat release/release.env release/source-commit.txt
          {
            echo "### Approved release"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Image: \`$IMAGE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload approved release bundle
        uses: actions/upload-artifact@v4
        with:
          name: approved-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
